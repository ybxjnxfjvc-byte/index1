name: security-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static repository security check
        run: python scripts/security_check.py
      - name: Python security lab tests
        run: python -m unittest discover -s tests/python -v

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Browser security smoke
        run: npx playwright test tests/playwright --project=chromium
